version: '3.8'

services:
  pointcloud-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 3d-detection-pipeline
    ports:
      - "8501:8501"
    volumes:
      # Mount dataset directories for persistence
      # Place your datasets in these local directories
      - ./dataset/nuscenes:/app/dataset/nuscenes:ro
      - ./dataset/kitti:/app/dataset/kitti:ro
      # Optional: Mount for any output/results persistence
      - ./output:/app/output
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Optional: Add a reverse proxy for custom domain/SSL
